<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Turno Noche: Dos Consolas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: dark "war room" frame with a mission HUD; inside, two very different software worlds — a dense legacy scheduler and the ProBatch AI console. Single deliberate dark frame. */
:root {
  color-scheme: dark;
  --night: #070C1A; --panel: #0F1730; --panel-2: #152044; --line: #233260;
  --ink: #EAF0FB; --muted: #97A5C8; --dim: #6B7A9C;
  --accent: #3B7BFF; --ok: #2BC47D; --warn: #F4A93B; --err: #F25A74; --vio: #A98BFF;
  --display: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  /* legacy scheduler world */
  --l-bg: #E9ECF1; --l-bar: #D5DAE2; --l-bar2: #C4CAD4; --l-ink: #1B2130; --l-line: #A9B1BF; --l-sel: #2B5FB8;
  --l-font: Tahoma, 'Segoe UI', Verdana, Arial, sans-serif;
  /* probatch world */
  --p-bg: #EEF2F9; --p-card: #FFFFFF; --p-ink: #0F172A; --p-mut: #5B6478; --p-line: #E1E6EF; --p-acc: #2D6FF7;
}
* { box-sizing: border-box; }
body { background: var(--night); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(1000px 600px at 15% -10%, rgba(59,123,255,.15), transparent 60%), radial-gradient(800px 600px at 110% 110%, rgba(169,139,255,.10), transparent 60%); }
.wrap { position: relative; max-width: 1320px; margin: 0 auto; padding-inline: 18px; padding-block: 16px 40px; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.brand svg { width: 20px; height: 25px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps i { width: 26px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.steps i.done { background: var(--ok); } .steps i.now { background: var(--accent); }

/* HUD */
.hud { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
.hc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.hl { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.mtitle { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-top: 2px; }
.score { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; flex-wrap: wrap; }
.score b { font-family: var(--mono); font-size: 24px; font-variant-numeric: tabular-nums; }
.score span { font-size: 12.5px; color: var(--muted); }
.hc.legacy b { color: #FF9FB0; } .hc.pbx b { color: #7EE2B0; }
.hc.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* stage */
.stage { position: relative; }
.brief { max-width: 860px; margin: 5vh auto 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #8FB2FF; }
.brief h1 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.08; letter-spacing: -1px; margin: 10px 0 14px; text-wrap: balance; }
.brief p { color: var(--muted); font-size: 17px; margin: 0 0 14px; max-width: 64ch; }
.quote { border-left: 3px solid var(--warn); padding: 6px 0 6px 14px; color: #F7D9A8; font-size: 17px; font-style: italic; margin: 16px 0 22px; }
.kpi { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; margin-bottom: 20px; }
.kpi em { font-style: normal; color: #8FB2FF; font-weight: 800; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font-size: 15.5px; font-weight: 800; cursor: pointer; text-decoration: none; }
.cta.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.cta:disabled { opacity: .5; cursor: default; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 16px; max-width: 80ch; }
.field { display: grid; gap: 6px; max-width: 420px; margin-bottom: 18px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: inherit; }

.play { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; align-items: start; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.task h3 { margin: 0; font-size: 16px; letter-spacing: -.2px; text-wrap: balance; }
.task p { margin: 0; color: var(--muted); font-size: 14px; }
.who { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; width: fit-content; }
.who.l { background: rgba(244,169,59,.12); color: var(--warn); } .who.p { background: rgba(59,123,255,.15); color: #9DBCFF; }
.feed { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; }
.fi { font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); animation: fin .3s ease-out; }
.fi .c { font-family: var(--mono); font-size: 12px; color: var(--warn); margin-left: 6px; white-space: nowrap; }
.fi.good .c { color: var(--ok); }
.fi.bad { border-left: 3px solid var(--err); } .fi.good { border-left: 3px solid var(--ok); }
@keyframes fin { from { opacity: 0; transform: translateY(5px); } }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.opt:hover { border-color: #3C5391; background: #1B2748; }
.opt small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 1px; }
.opt.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .opt.primary small { color: rgba(255,255,255,.8); }
.opt:disabled { opacity: .45; cursor: default; }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted); }

/* ------------- LEGACY SCHEDULER WINDOW ------------- */
.lw { background: var(--l-bg); color: var(--l-ink); font-family: var(--l-font); font-size: 12px; border: 1px solid #7C8596; border-radius: 6px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); min-width: 0; }
.lw .tb { background: linear-gradient(#3C4A66, #2C3850); color: #E8ECF4; padding: 5px 10px; display: flex; justify-content: space-between; font-size: 12px; }
.lw .tb span:last-child { letter-spacing: 6px; }
.lw .menu { background: var(--l-bar); border-bottom: 1px solid var(--l-line); padding: 3px 8px; display: flex; gap: 14px; }
.lw .tools { background: linear-gradient(#EEF1F5, #D9DEE6); border-bottom: 1px solid var(--l-line); padding: 4px 6px; display: flex; gap: 3px; flex-wrap: wrap; }
.lw .tools button { font-family: var(--l-font); font-size: 11.5px; padding: 3px 8px; border: 1px solid #9AA3B2; background: linear-gradient(#FDFEFF, #E3E7EE); border-radius: 3px; color: var(--l-ink); cursor: pointer; }
.lw .tools button:hover:not(:disabled) { background: linear-gradient(#FFF, #D2E1FA); border-color: var(--l-sel); }
.lw .tools button:disabled { color: #9AA1AE; cursor: default; }
.lw .tools .sep { width: 1px; background: #A9B1BF; margin: 0 4px; }
.lw .body { display: grid; grid-template-columns: 170px minmax(0, 1fr); min-height: 380px; }
.lw .tree { background: #F6F7F9; border-right: 1px solid var(--l-line); padding: 6px 4px; font-size: 11.5px; overflow: hidden; }
.lw .tree div { padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lw .tree .sel { background: var(--l-sel); color: #fff; }
.lw .main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
.lw .gridwrap { overflow: auto; max-height: 300px; background: #fff; }
.lw table { border-collapse: collapse; width: 100%; min-width: 620px; color: var(--l-ink); font-family: var(--l-font); font-size: 11.5px; }
.lw th { position: sticky; top: 0; background: linear-gradient(#F4F6F9, #DDE2EA); border: 1px solid #B8BFCB; font-weight: 700; text-align: left; padding: 3px 6px; font-size: 11.5px; }
.lw td { border: 1px solid #E1E5EB; padding: 2px 6px; white-space: nowrap; font-size: 11.5px; }
.lw tr.row { cursor: pointer; } .lw tr.row:hover td { background: #E8F0FD; }
.lw tr.sel td { background: var(--l-sel) !important; color: #fff !important; }
.lw tr.seen td { color: #7A8394; }
.st { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(0,0,0,.35); margin-right: 5px; vertical-align: -1px; }
.st.ok { background: #3DBB4E; } .st.ex { background: #F2D338; } .st.er { background: #E2383A; } .st.wt { background: #A7AEB9; } .st.hd { background: #8E6BD0; }
.lw .pane { border-top: 2px solid var(--l-bar2); background: #F4F6F9; padding: 6px 8px; font-size: 11.5px; min-height: 64px; max-height: 190px; overflow: auto; }
.lw .pane .ttl { font-weight: 700; margin-bottom: 4px; }
.lw .kv { display: grid; grid-template-columns: 120px 1fr; gap: 1px 8px; }
.lw .log { font-family: Consolas, 'Courier New', monospace; font-size: 11px; background: #FFFFFF; border: 1px solid #C4CAD4; padding: 6px; white-space: pre; overflow: auto; max-height: 170px; color: #2A3040; }
.lw .status { background: var(--l-bar); border-top: 1px solid var(--l-line); padding: 3px 8px; display: flex; justify-content: space-between; font-size: 11px; color: #3A4254; gap: 10px; flex-wrap: wrap; }
.lw .alerts .ar { display: grid; grid-template-columns: 58px 70px 1fr; gap: 6px; border-bottom: 1px solid #E1E5EB; padding: 2px 0; animation: fin .2s; }
.lw .alerts .ar b { color: #B3261E; }
.lw .graph { background: #fff; padding: 14px; overflow: auto; min-height: 300px; }
.gnode { display: inline-block; border: 1px solid #6D7788; background: #F1F3F6; padding: 3px 7px; font-size: 11px; margin: 4px; border-radius: 2px; animation: fin .3s; }
.gnode.er { background: #F7C9CA; border-color: #B3261E; } .gnode.biz { background: #FFF4C2; border-color: #B08A00; font-weight: 700; }
.glevel { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px 0; border-bottom: 1px dashed #D5DAE2; }
.glevel .lv { font-size: 10.5px; color: #7A8394; width: 64px; }
.doc { background: #fff; border: 1px solid #C4CAD4; padding: 10px 12px; font-family: 'Times New Roman', Georgia, serif; font-size: 13px; color: #222; max-height: 240px; overflow: auto; }
.doc h5 { margin: 0 0 6px; font-size: 15px; } .doc .old { background: #FFF3B0; }
.mail { display: grid; grid-template-columns: 18px 150px 1fr 60px; gap: 6px; padding: 3px 6px; border-bottom: 1px solid #E1E5EB; font-size: 11.5px; background: #fff; animation: fin .15s; }
.mail.unread { font-weight: 700; }

/* ------------- PROBATCH WORLD ------------- */
.pw { background: var(--p-bg); color: var(--p-ink); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); position: relative; min-width: 0; font-family: var(--display); }
.pw .ptop { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--p-line); gap: 10px; }
.pw .ptop .pt { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
.pw .ptop .pt svg { width: 16px; height: 20px; }
.pw .ptop .av { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.pw .pbody { padding: 14px; min-height: 380px; position: relative; }
.bits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bit { background: #fff; border: 1px solid var(--p-line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; transition: box-shadow .3s, border-color .3s; }
.bit h6 { margin: 0 0 2px; font-size: 13px; }
.bit .env { color: var(--p-mut); font-size: 11px; }
.bit .pb { height: 5px; background: #E6EBF4; border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
.bit .pb i { display: block; height: 100%; background: var(--p-acc); border-radius: 3px; transition: width .6s; }
.bit .s { font-size: 11px; color: var(--p-acc); font-weight: 700; }
.bit.warn { border-color: #F2A93B; box-shadow: 0 0 0 3px rgba(242,169,59,.25); } .bit.warn .s { color: #C47A00; } .bit.warn .pb i { background: #F2A93B; }
.bit.err { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.2); } .bit.err .s { color: #DC2626; } .bit.err .pb i { background: #EF4444; }
.toast { position: absolute; right: 14px; bottom: 14px; width: min(360px, calc(100% - 28px)); background: #fff; border: 1px solid var(--p-line); border-left: 3px solid #EF4444; border-radius: 12px; padding: 12px 14px; box-shadow: 0 20px 50px rgba(15,23,42,.25); transform: translateY(30px); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.toast.show { transform: none; opacity: 1; animation: ping 1.6s ease-out .5s 2; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.45), 0 20px 50px rgba(15,23,42,.25); } 100% { box-shadow: 0 0 0 22px rgba(239,68,68,0), 0 20px 50px rgba(15,23,42,.25); } }
.toast h6 { margin: 0; font-size: 13.5px; }
.toast .live { font-size: 11px; color: var(--p-mut); display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; }
.toast .live i { width: 7px; height: 7px; border-radius: 50%; background: #EF4444; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.toast p { margin: 0 0 10px; font-size: 12.5px; color: #3B4458; }
.pbtn { border: 0; background: var(--p-acc); color: #fff; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 9px; cursor: pointer; }
.pbtn.sec { background: #fff; color: var(--p-ink); border: 1px solid var(--p-line); }
.side { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; border-left: 1px solid var(--p-line); box-shadow: -20px 0 50px rgba(15,23,42,.12); transform: translateX(105%); transition: transform .5s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.side.show { transform: none; }
.side .sh { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--p-line); font-weight: 800; font-size: 14px; }
.side .sb { padding: 12px 14px; overflow-y: auto; display: grid; gap: 10px; align-content: start; flex: 1; }
.msg { font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: #F2F5FA; color: var(--p-ink); animation: fin .3s; }
.msg.me { background: var(--p-acc); color: #fff; justify-self: end; max-width: 85%; }
.agent { font-size: 11px; font-weight: 700; color: #7C3AED; display: flex; align-items: center; gap: 6px; }
.agent::before { content: ''; width: 14px; height: 14px; border-radius: 4px; background: #EDE7FE; }
.facts { display: grid; gap: 6px; }
.facts div { background: #F6F8FC; border: 1px solid var(--p-line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.facts b { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--p-acc); margin-bottom: 1px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #EEF3FF; color: var(--p-acc); }
.chip.red { background: #FDECEC; color: #DC2626; } .chip.green { background: #E7F8EF; color: #13824B; } .chip.amber { background: #FFF4E0; color: #B26A00; } .chip.vio { background: #F1ECFE; color: #6D28D9; }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--p-acc); vertical-align: -2px; animation: blink .8s infinite; }
.pgraph { display: grid; gap: 8px; }
.pnode { background: #fff; border: 1px solid var(--p-line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; transition: all .4s; }
.pnode.hit { border-color: #EF4444; background: #FFF6F6; box-shadow: 0 0 0 3px rgba(239,68,68,.15); }
.pnode.biz.hit { border-color: #F2A93B; background: #FFFBF1; box-shadow: 0 0 0 3px rgba(242,169,59,.2); }
.case { background: #fff; border: 1px solid var(--p-line); border-radius: 12px; padding: 12px; font-size: 12.5px; display: grid; gap: 6px; animation: fin .35s; }
.case .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; flex-wrap: wrap; }
.grp { display: grid; gap: 8px; }
.alertmini { font-size: 11.5px; background: #fff; border: 1px solid var(--p-line); border-radius: 8px; padding: 4px 8px; color: var(--p-mut); transition: all .5s; }
.auditrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12.5px; }
.auditrow span { color: var(--p-mut); font-size: 11px; display: block; }
.diff { display: flex; align-items: center; gap: 6px; }
.diff .a { background: #FDECEC; color: #B91C1C; padding: 1px 8px; border-radius: 6px; text-decoration: line-through; }
.diff .b { background: #E7F8EF; color: #13824B; padding: 1px 8px; border-radius: 6px; }

/* compare + final */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.cbox { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); }
.cbox .n { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.cbox.l .n { color: #FF9FB0; } .cbox.p .n { color: #7EE2B0; }
.cbox ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
.lesson { margin-top: 12px; background: linear-gradient(90deg, rgba(59,123,255,.18), rgba(169,139,255,.10)); border: 1px solid rgba(59,123,255,.35); border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 700; }
.lesson small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #9DBCFF; margin-bottom: 3px; }
.xfade { transition: filter .6s, opacity .6s, transform .6s; }
.xfade.out { filter: grayscale(1) blur(2px); opacity: .25; transform: scale(.97); }
.xfade.in { animation: pbin .9s cubic-bezier(.2,.8,.2,1); }
@keyframes pbin { from { opacity: 0; transform: scale(1.03); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.intro-x { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(900px 600px at 50% 45%, #1A3A8F 0%, #0B1636 45%, #050914 100%); opacity: 0; pointer-events: none; transition: opacity .45s; cursor: pointer; }
.intro-x.show { opacity: 1; pointer-events: auto; }
.intro-x .box { text-align: center; padding: 0 22px; display: grid; justify-items: center; gap: 14px; }
.intro-x .logo { width: 84px; height: 104px; opacity: 0; transform: scale(.6) rotate(-8deg); filter: drop-shadow(0 0 40px rgba(59,123,255,.6)); }
.intro-x .l1 { font-size: clamp(15px, 2vw, 18px); color: #9DB0DA; font-weight: 600; opacity: 0; transform: translateY(10px); }
.intro-x .l2 { font-size: clamp(30px, 5.4vw, 60px); font-weight: 800; letter-spacing: -1.6px; line-height: 1.05; color: #fff; opacity: 0; transform: translateY(18px); }
.intro-x .l2 span { background: linear-gradient(90deg, #6EA0FF, #B69BFF); -webkit-background-clip: text; background-clip: text; color: transparent; }

.intro-x .hint b { color: #8FB2FF; font-weight: 800; }

      S.bank = $('#bank').value.trim() || 'tu banco'; S.core = $('#core').value;
      S.role = (app.querySelector('input[name=role]:checked') || {}).value || 'ops';
      S.full = ((app.querySelector('input[name=route]:checked') || {}).value === 'f');
      S.route = S.full ? MISSIONS.map((_, i) => i) : ROLES[S.role].route.slice();
      S.stage = 'Empezó el turno'; track('start', { role: ROLES[S.role].label, bank: S.bank === 'tu banco' ? '' : S.bank, core: S.core ? CORES[S.core] : '', recorrido: S.full ? 'Completo' : 'Rápido', personalizado: !!PARAMS.b });
      runStep(0);
    };
  }

  // ---------- inputs ----------
  const FIELDS = [
    ['inc', 'Incidentes batch por mes', 'Fallas, demoras o bloqueos que requieren intervención.', 'por mes'],
    ['pL', 'Personas involucradas por incidente hoy', 'Operador, especialista, DBA, jefe de turno…', 'personas'],

    ['crit', 'Incidentes dentro de la ventana crítica', 'Los que pueden hacer incumplir el SLA.', '%'],
    ['slaCostH', 'Costo de una hora de incumplimiento de SLA', 'Multas, sucursales sin saldos, reprocesos, reclamos.', 'USD'],
    ['windowH', 'Duración de la ventana batch', 'Del inicio del cierre al transaccional disponible.', 'horas'],
    ['audits', 'Requerimientos de auditoría por año', 'Internos, externos y del regulador.', 'por año'],
  ];
  function inputs() {
    S.k = S.route.length; S.side = null; hud(); document.getElementById('steps').innerHTML = S.route.map(() => '<i class="done"></i>').join('');
    track('inputs_view', {});
    app.innerHTML = `<section class="brief" style="max-width:980px"><div class="eyebrow">Último paso</div><h1>Tu operación en números</h1>
      <p>Ajustá estos valores a la realidad de ${esc(S.bank)}. Si no los tenés a mano, dejá los de referencia: son deliberadamente conservadores.</p>
      <form id="bizf" novalidate><div class="inputs">${FIELDS.map(([k, l, h, u]) => `<div class="inp"><label for="in_${k}">${l}</label><div class="row"><input id="in_${k}" type="number" inputmode="decimal" min="0" step="any" value="${S.B[k]}"><span class="u">${u}</span></div><small>${h}</small></div>`).join('')}</div>
      <div class="actions"><button class="cta" type="submit">Ver el informe de ${esc(S.bank === 'tu banco' ? 'mi banco' : S.bank)}</button><button class="cta ghost" type="button" id="defs">Usar valores de referencia</button><span class="fbmsg" id="bizmsg" aria-live="polite"></span></div></form></section>`;

    $('#defs').onclick = () => { S.B = Object.assign({}, DEFAULTS); S.stage = 'Cargó sus números'; track('inputs_submit', { values: Object.assign({ usedDefaults: true }, S.B) }); finale(); };

      B.pP = DEFAULTS.pP; if (B.crit > 100) B.crit = 100;
      S.B = B; S.stage = 'Cargó sus números'; track('inputs_submit', { values: Object.assign({ usedDefaults: false }, B) }); finale();
    };

  // ---------- report ----------
  function compute() {
    const B = S.B, get = id => S.res.find(r => r.id === id) || { L: 0, P: 0 };
    const ops = ['M1', 'M2', 'M3', 'M4', 'M5'].map(get);
    const opsL = ops.reduce((a, r) => a + r.L, 0), opsP = ops.reduce((a, r) => a + r.P, 0);
    const resolveL = ['M1', 'M2', 'M3', 'M4'].map(get).reduce((a, r) => a + r.L, 0), resolveP = ['M1', 'M2', 'M3', 'M4'].map(get).reduce((a, r) => a + r.P, 0);
    const incY = B.inc * 12;
    const teamH = Math.max(0, incY * (opsL * B.pL - opsP * B.pP) / 60), teamCost = teamH * B.costH;
    const critY = incY * B.crit / 100;
    const lateL = Math.max(0, resolveL - B.margin), lateP = Math.max(0, resolveP - B.margin);
    const avoided = Math.max(0, (resolveL > B.margin ? critY : 0) - (resolveP > B.margin ? critY : 0));
    const slaCost = Math.max(0, critY * (lateL - lateP) / 60 * B.slaCostH);
    const m6 = get('M6'), auditH = Math.max(0, B.audits * (m6.L - m6.P) / 60), auditCost = auditH * B.costH;
    const winMin = B.windowH * 60 * 75 / 290, winHY = winMin * 365 / 60;
    const total = teamCost + slaCost + auditCost;
    return { opsL, opsP, resolveL, resolveP, incY, teamH, teamCost, critY, avoided, slaCost, auditH, auditCost, winMin, winHY, total, fte: teamH / 1760 };
  }
  function reportLines() {
    const R = compute(), B = S.B;
    return ['Informe anual estimado (valores ingresados: ' + `${B.inc} incidentes/mes, ${B.pL} personas, USD ${B.costH}/h, margen SLA ${B.margin} min, ${B.crit}% en ventana crítica, USD ${B.slaCostH}/h de incumplimiento, ventana ${B.windowH} h, ${B.audits} auditorías/año):`,
      `- Incumplimientos de SLA evitados: ${fmtN(R.avoided)} por año`,
      `- Horas del equipo recuperadas: ${fmtN(R.teamH)} por año (${(Math.round(R.fte * 10) / 10).toString().replace('.', ',')} personas a tiempo completo)`,
      `- Ventana batch: ${fmtN(R.winMin)} min menos por noche, ${fmtN(R.winHY)} horas por año (potencial)`,
      `- Costo operativo evitado: USD ${fmtN(R.total)} por año (SLA USD ${fmtN(R.slaCost)} · equipo USD ${fmtN(R.teamCost)} · auditoría USD ${fmtN(R.auditCost)})`,
      `- Tiempo de resolución por incidente: ${dur(R.resolveL)} → ${dur(R.resolveP)}`];
  }
  function finale() {
    S.k = S.route.length; S.side = null; hud(); document.getElementById('steps').innerHTML = S.route.map(() => '<i class="done"></i>').join('');

      cost: ['Costo operativo evitado', `USD ${fmtN(R.total)}<small style="font-size:15px"> /año</small>`, `SLA USD ${fmtN(R.slaCost)} · equipo USD ${fmtN(R.teamCost)} · auditoría USD ${fmtN(R.auditCost)}.`],
    };
    const head = {
      ops: `${bank} evitaría ${fmtN(R.avoided)} incumplimientos de SLA por año y recuperaría ${fmtN(R.teamH)} horas de su equipo.`,
      cio: `${bank} podría terminar el cierre ${fmtN(R.winMin)} minutos antes cada noche y resolver incidentes en ${dur(R.resolveP)} en lugar de ${dur(R.resolveL)}.`,
      cfo: `${bank} evitaría unos USD ${fmtN(R.total)} por año en costos de SLA, equipo y auditoría.`,
      core: `${bank} podría liberar ${fmtN(R.winMin)} minutos de ventana batch cada noche${S.core ? ' sobre su core ' + esc(CORES[S.core]) : ''} sin sumar infraestructura.`,
      rpa: `${bank} recuperaría ${fmtN(R.teamH)} horas de intervención manual por año y resolvería incidentes en ${dur(R.resolveP)} en lugar de ${dur(R.resolveL)}.`,
    }[S.role];
    const bankName = S.bank === 'tu banco' ? 'tu banco' : S.bank;
    app.innerHTML = `<section class="final"><div class="eyebrow">Informe para el directorio · vista ${role.label}</div>
      <h1>${head}</h1>
      <div class="kpis">${role.order.map((k, i) => `<div class="kcard ${i === 0 ? 'lead' : ''}"><div class="hl">${K[k][0]}</div><div class="n">${K[k][1]}</div><p>${K[k][2]}</p></div>`).join('')}</div>
      <div class="roi"><p>¿Y el retorno de la inversión?<small>Con tu propuesta comercial calculamos el ROI y el período de repago sobre estos mismos números.</small></p><button class="cta" id="roi">Calculemos mi retorno</button></div>
      <details class="how"><summary>Cómo lo calculamos</summary><ul>
        <li>Incidentes al año: ${B.inc} × 12 = ${fmtN(R.incY)}. Tiempo por incidente (misiones 1 a 5): ${dur(R.opsL)} hoy y ${dur(R.opsP)} con ProBatch AI, medido en tu simulación.</li>
        <li>Horas del equipo: incidentes × (tiempo hoy × ${B.pL} personas − tiempo con ProBatch × ${B.pP} persona). Costo: × USD ${B.costH} por hora.</li>
        <li>SLA: el ${B.crit}% de los incidentes cae en la ventana crítica (${fmtN(R.critY)} al año). Hay incumplimiento cuando la resolución (misiones 1 a 4) supera el margen de ${B.margin} min. Costo: minutos de retraso evitados × USD ${fmtN(B.slaCostH)} por hora.</li>
        <li>Auditoría: ${B.audits} requerimientos × (${dur(S.res.find(r => r.id === 'M6').L)} − ${dur(S.res.find(r => r.id === 'M6').P)}) × USD ${B.costH} por hora.</li>
        <li>Ventana batch: reducción del 26% simulada en la misión 7, aplicada a tu ventana de ${B.windowH} h. Es una oportunidad potencial y no se suma al costo evitado.</li>
        <li>Las misiones que no jugaste se calculan con tiempos típicos y figuran como «típico» en la tabla.</li>
        <li>No incluye el costo de la licencia ni los ahorros de infraestructura: ambos se evalúan con la propuesta comercial.</li></ul></details>
      <div class="actions"><button class="cta ghost" id="share">Enviar este informe a mi jefe</button><button class="cta ghost" id="edit">Cambiar mis números</button></div>
      <div class="contact" id="shareBox" hidden><div class="copybox" id="shareTxt"></div><div class="actions" style="margin-top:10px"><button class="cta ghost" id="shareCopy">Copiar el informe</button><span class="fbmsg" id="shareMsg" aria-live="polite"></span></div></div>
      <div style="margin-top:24px">${PROOF}</div><h2 style="margin:6px 0 12px;font-size:22px;letter-spacing:-.4px">Misión por misión</h2>
      <div class="tblwrap"><table class="cmp"><thead><tr><th>Qué se mide</th><th>Scheduler tradicional</th><th>ProBatch hoy y ProBatch AI</th></tr></thead><tbody>
        ${S.res.map(r => `<tr><td>${r.row[0]}<span class="t">${r.lever}</span></td><td>${r.row[1]}<span class="t">${dur(r.L)}${r.skipped ? ' · típico' : ''}</span></td><td>${r.row[2]}<span class="mini next">IA en desarrollo</span><span class="t">${dur(r.P)}${r.skipped ? ' · típico' : ''}</span><span class="t" style="color:#7EE2B0">Hoy: ${MISSIONS.find(m => m.id === r.id).today}</span></td></tr>`).join('')}
        <tr><td>Licenciamiento</td><td>Habitualmente por job, agente o volumen</td><td>Derecho de uso ilimitado en el entorno acordado, sin costo por usuario ni por volumen de procesos <span class="flag">Según Accusys</span></td></tr>
        <tr><td>Soporte</td><td>Variable según proveedor y región</td><td>24x7 en español, con responsable exclusivo en incidentes críticos (respuesta S1 en 1 hora) <span class="flag">Según Accusys</span></td></tr>
        <tr><td>Ecosistema bancario LATAM</td><td>Integraciones genéricas</td><td>${S.core && S.core !== 'otro' ? `Integración con ${esc(CORES[S.core])} y` : 'Cores bancarios de la región (Bantotal, Cobis, Temenos) y'} requisitos regulatorios locales <span class="flag">Según Accusys</span></td></tr>
        <tr><td>Automatización de pantallas (RPA)</td><td>Herramienta RPA separada, con otra consola y otro proveedor</td><td>Probot, en la misma suite: automatiza tareas sobre aplicaciones sin API, orquestadas junto al batch <span class="flag">Según Accusys</span></td></tr>
      </tbody></table></div>
      <div class="actions"><button class="cta" id="demo">Pedir el diagnóstico de mi cierre (30 min)</button><a class="cta ghost" href="https://www.accusystechnology.com" target="_blank" rel="noopener">Conocer Accusys Technology</a><button class="cta ghost" id="again">Volver a jugar</button></div>
      <form class="fb" id="fb" novalidate>
        <div><h2>¿Nos das tu opinión?</h2></div><p class="sub">Tarda un minuto y nos ayuda a mostrarte lo que de verdad importa en tu operación.</p>
        <fieldset class="q"><legend>¿Qué tan identificado te sentiste con estas situaciones?</legend>
          <div class="scale" id="fbScale">${[1,2,3,4,5].map(n => `<button type="button" data-v="${n}" aria-pressed="false">${n}</button>`).join('')}<small><span>Nada</span><span>Es mi día a día</span></small></div></fieldset>
        <fieldset class="q"><legend>¿Cuáles de estos problemas vive tu operación hoy?</legend>
          <div class="pills">${S.res.map((r, i) => `<input type="checkbox" id="fbp${i}" value="${esc(r.kpi)}"><label for="fbp${i}">${esc(r.kpi)}</label>`).join('')}</div></fieldset>
        <fieldset class="q"><legend>¿Qué capacidad de ProBatch AI te resultó más valiosa?</legend>
          <div class="pills">${['Aviso proactivo', 'Diagnóstico con IA', 'Impacto en el negocio', 'Captura de conocimiento', 'Agrupación de alertas', 'Evidencia para auditoría', 'Optimización de la ventana batch'].map((c, i) => `<input type="radio" name="fbcap" id="fbc${i}" value="${c}"><label for="fbc${i}">${c}</label>`).join('')}</div></fieldset>
        <fieldset class="q"><legend>¿Querés un diagnóstico de 30 minutos del cierre de tu banco, sin costo?</legend>
          <div class="pills">${['Sí, quiero el diagnóstico de 30 min', 'Más adelante', 'No por ahora'].map((c, i) => `<input type="radio" name="fbdemo" id="fbd${i}" value="${c}"><label for="fbd${i}">${c}</label>`).join('')}</div></fieldset>
        <div class="q"><label for="fbc">¿Qué le cambiarías o qué te faltó ver?</label><textarea id="fbc" maxlength="1500" placeholder="Por ejemplo: cómo se integra con nuestro core, costos, tiempos de implementación…"></textarea></div>
        <div class="fgrid">
          <div class="field"><label for="fbn">Nombre</label><input id="fbn" type="text" maxlength="80" autocomplete="name"></div>
          <div class="field"><label for="fbr">Cargo</label><input id="fbr" type="text" maxlength="80" autocomplete="organization-title" placeholder="${esc(ROLES[S.role].example)}"></div>
          <div class="field"><label for="fbb">Banco / institución</label><input id="fbb" type="text" maxlength="80" autocomplete="organization" value="${S.bank === 'tu banco' ? '' : esc(S.bank)}"></div>
          <div class="field"><label for="fbe">Email (si querés que te contactemos)</label><input id="fbe" type="email" maxlength="120" autocomplete="email"></div>

    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    const toForm = () => { const d = document.getElementById('fbd0'); if (d) d.checked = true; $('#fb').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); };
    $('#demo').onclick = () => { track('demo_click', {}); toForm(); }; $('#roi').onclick = () => { track('roi_click', {}); toForm(); };
    $('#edit').onclick = () => { track('edit_numbers', {}); inputs(); };
    $('#share').onclick = () => {
      track('share_report', {});
      const text = [`Informe: impacto estimado de ProBatch AI en ${bankName}`, '', ...reportLines(), '', 'Generado con el simulador "Turno noche: dos consolas" de Accusys Technology. Estimaciones ilustrativas basadas en los valores ingresados.'].join('\n');
      $('#shareBox').hidden = false; $('#shareTxt').textContent = text;
      const a = document.createElement('a'); a.href = 'mailto:?subject=' + encodeURIComponent('Impacto estimado de ProBatch AI en ' + bankName) + '&body=' + encodeURIComponent(text); a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();

      $('#shareCopy').onclick = () => { const ok = t => $('#shareMsg').textContent = t; const sel = () => { const r = document.createRange(); r.selectNodeContents($('#shareTxt')); const w = window.getSelection(); w.removeAllRanges(); w.addRange(r); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => ok('Copiado.'), () => { sel(); ok('Seleccioné el texto: copialo con Ctrl+C.'); }); else { sel(); ok('Seleccioné el texto: copialo con Ctrl+C.'); } };
    };
    let score = 0;

    $('#fb').onsubmit = async (e) => {

        'Identificación con las situaciones (1-5): ' + score,
        'Problemas que vive hoy: ' + (pains.length ? pains.join(', ') : '—'),

        '',
        'Rol: ' + ROLES[S.role].label,

  }

})();
